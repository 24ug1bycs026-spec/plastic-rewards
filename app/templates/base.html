<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recycle Rewards</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar bg-success navbar-dark px-3">
  <a class="navbar-brand" href="{{ url_for('main.home') }}">♻ Recycle Rewards</a>
  <div>
    {% if current_user.is_authenticated %}
      <a class="btn btn-sm btn-light me-2" href="{{ url_for('main.deposit') }}">Deposit</a>
      <a class="btn btn-sm btn-outline-light" href="{{ url_for('main.logout') }}">Logout</a>
    {% else %}
      <a class="btn btn-sm btn-light me-2" href="{{ url_for('main.login') }}">Login</a>
      <a class="btn btn-sm btn-outline-light" href="{{ url_for('main.register') }}">Register</a>
    {% endif %}
  </div>
</nav>
<div class="container my-4" style="max-width: 640px;">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
